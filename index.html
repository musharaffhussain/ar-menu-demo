<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zinger Burger AR Demo</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #f5f5f5;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>

<model-viewer
  src="./zinger_burger.glb"
  ar
  ar-modes="scene-viewer quick-look webxr"
  camera-controls
  auto-rotate
  shadow-intensity="1">

  <button slot="ar-button">
    🍔 View in AR
  </button>

</model-viewer>

</body>
</html>
