<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zinger Burger AR</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    #enter-ar {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      background: black;
      color: white;
      font-size: 16px;
      z-index: 999;
      cursor: pointer;
    }
  </style>
</head>
<body>

<button id="enter-ar">🍔 Start AR</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166/examples/jsm/"
  }
}
</script>

<script type="module" src="./app.js"></script>

</body>
</html>
